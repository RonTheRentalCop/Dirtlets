name: Auto Commit Build Logs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  build-and-log:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Build Log and Timestamp
        run: |
          mkdir -p logs
          echo "Build executed successfully at $(date -u)" >> logs/build_history.log

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          
          git add logs/build_history.log
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: automated build log update $(date -u +'%Y-%m-%d %H:%M:%S') [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
