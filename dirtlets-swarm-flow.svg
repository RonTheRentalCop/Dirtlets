<svg width="680" height="700" viewBox="0 0 680 700" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Dirtlets swarm decision loop</title>
<desc>Flowchart showing the rover swarm sensing its surroundings, a central computer analyzing the data and scoring rover health, a decision on which rover leads locally, target selection, and the swarm executing and looping back to sensing.</desc>
<rect width="680" height="700" fill="#0d0f10"/>
<defs>
<marker id="arrow-dust" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#C98B5B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-sandstone" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#D6A06A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="340" y1="96" x2="340" y2="132" stroke="#C98B5B" stroke-width="1.5" marker-end="url(#arrow-dust)"/>
<line x1="340" y1="192" x2="340" y2="226" stroke="#C98B5B" stroke-width="1.5" marker-end="url(#arrow-dust)"/>
<path d="M340 330 L340 355 L170 355 L170 376" fill="none" stroke="#C98B5B" stroke-width="1.5" marker-end="url(#arrow-dust)"/>
<path d="M340 330 L340 355 L510 355 L510 376" fill="none" stroke="#C98B5B" stroke-width="1.5" marker-end="url(#arrow-dust)"/>
<path d="M170 436 L170 478 L336 478 L336 496" fill="none" stroke="#C98B5B" stroke-width="1.5" marker-end="url(#arrow-dust)"/>
<path d="M510 436 L510 478 L344 478 L344 496" fill="none" stroke="#C98B5B" stroke-width="1.5" marker-end="url(#arrow-dust)"/>
<line x1="340" y1="556" x2="340" y2="592" stroke="#C98B5B" stroke-width="1.5" marker-end="url(#arrow-dust)"/>
<path d="M230 624 C110 600 110 150 226 70" fill="none" stroke="#D6A06A" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#arrow-sandstone)"/>
<text x="34" y="352" font-size="12" fill="#D6A06A" font-family="sans-serif">loop</text>

<g>
<rect x="230" y="40" width="220" height="56" rx="8" fill="#111417" stroke="#6F7475" stroke-width="0.5"/>
<text x="340" y="57" text-anchor="middle" font-size="14" font-weight="500" fill="#E7E0D5" font-family="sans-serif">Rover swarm</text>
<text x="340" y="79" text-anchor="middle" font-size="12" fill="#D6A06A" font-family="sans-serif">ESP32-CAM / lidar / IMU</text>
</g>

<g>
<rect x="230" y="136" width="220" height="56" rx="8" fill="#111417" stroke="#A3472F" stroke-width="0.5"/>
<text x="340" y="153" text-anchor="middle" font-size="14" font-weight="500" fill="#E7E0D5" font-family="sans-serif">Central analysis</text>
<text x="340" y="175" text-anchor="middle" font-size="12" fill="#D6A06A" font-family="sans-serif">Builds map &amp; health score</text>
</g>

<g>
<polygon points="340,228 452,280 340,332 228,280" fill="#4A2923" stroke="#B7472A" stroke-width="1.5"/>
<text x="340" y="272" text-anchor="middle" font-size="14" font-weight="500" fill="#E7E0D5" font-family="sans-serif">Best local</text>
<text x="340" y="292" text-anchor="middle" font-size="14" font-weight="500" fill="#E7E0D5" font-family="sans-serif">leader?</text>
</g>

<g>
<rect x="70" y="380" width="200" height="56" rx="8" fill="#111417" stroke="#C98B5B" stroke-width="0.5"/>
<text x="170" y="397" text-anchor="middle" font-size="14" font-weight="500" fill="#E7E0D5" font-family="sans-serif">Leader relays</text>
<text x="170" y="419" text-anchor="middle" font-size="12" fill="#D6A06A" font-family="sans-serif">Shares group data</text>
</g>

<g>
<rect x="410" y="380" width="200" height="56" rx="8" fill="#111417" stroke="#D6A06A" stroke-width="0.5"/>
<text x="510" y="397" text-anchor="middle" font-size="14" font-weight="500" fill="#E7E0D5" font-family="sans-serif">Rover leads</text>
<text x="510" y="419" text-anchor="middle" font-size="12" fill="#D6A06A" font-family="sans-serif">Takes lead role</text>
</g>

<g>
<rect x="230" y="500" width="220" height="56" rx="8" fill="#111417" stroke="#A3472F" stroke-width="0.5"/>
<text x="340" y="517" text-anchor="middle" font-size="14" font-weight="500" fill="#E7E0D5" font-family="sans-serif">Target selection</text>
<text x="340" y="539" text-anchor="middle" font-size="12" fill="#D6A06A" font-family="sans-serif">Compute nav commands</text>
</g>

<g>
<rect x="230" y="596" width="220" height="56" rx="8" fill="#111417" stroke="#B7472A" stroke-width="0.5"/>
<text x="340" y="613" text-anchor="middle" font-size="14" font-weight="500" fill="#E7E0D5" font-family="sans-serif">Swarm executes</text>
<text x="340" y="635" text-anchor="middle" font-size="12" fill="#D6A06A" font-family="sans-serif">Spreads &amp; updates map</text>
</g>
</svg>
